
name: BattleClash APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check project files
        run: |
          test -f package.json || (echo "ERROR: package.json is missing from the repository root" && exit 1)
          node -e "const p=require('./package.json'); console.log('Package:',p.name); console.log('Scripts:',p.scripts)"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Capacitor Android project
        run: |
          if [ ! -d android ]; then
            echo "ERROR: Android project folder is missing."
            echo "A valid Capacitor Android project must be added before an APK can be built."
            exit 1
          fi
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleClash-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
