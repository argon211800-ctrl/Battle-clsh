
name: BattleClash APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check project
        run: |
          test -f package.json || { echo "package.json is missing"; exit 1; }
          node -e "const p=require('./package.json'); console.log(p.scripts)"

          - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --verbose 2>&1 | tee npm-install.log
        continue-on-error: true

      - name: Show npm error details
        if: always()
        run: |
          tail -n 60 npm-install.log || true

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          if [ ! -d android ]; then
            echo "Android project folder is missing."
            exit 1
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleClash-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
